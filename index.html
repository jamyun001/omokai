<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오목 AI (렌주룰) — 수의 이유를 %로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f2ece0; --paper2:#e9e1d1; --ink:#1f1b16; --ink2:#3d362d; --muted:#7d7366; --rule:#d3c7b1;
  --atk:#b8402b; --def:#2f5b86; --read:#b07f24; --pos:#4c7a5b;
  --serif:'Noto Serif KR',serif; --sans:'Noto Sans KR',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}
.wrap{max-width:1280px;margin:0 auto;padding:28px 22px 48px}
header{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:18px}
h1{font-family:var(--serif);font-weight:900;font-size:40px;margin:0;line-height:1;letter-spacing:-1px}
.seal{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;background:var(--atk);color:#f6efe2;font-family:var(--serif);font-weight:900;font-size:15px;border-radius:3px;transform:rotate(-4deg);margin-bottom:3px}
header p{margin:0 0 3px auto;color:var(--muted);font-size:13px}
.main{display:flex;gap:34px;align-items:flex-start;flex-wrap:wrap}
.boardCol{flex:1 1 620px;min-width:300px;max-width:820px}
.side{flex:1 1 340px;min-width:300px}
.controls{display:flex;gap:10px 14px;flex-wrap:wrap;margin-bottom:14px;align-items:center;font-size:14px}
.controls label.f{display:flex;align-items:center;gap:6px;color:var(--muted)}
select{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:none;border-bottom:1px solid var(--ink2);padding:3px 2px;cursor:pointer;border-radius:0}
button{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:1px solid var(--ink);padding:6px 14px;cursor:pointer;border-radius:2px}
button:hover{background:var(--paper2)}
button.primary{background:var(--ink);color:var(--paper)}
button.primary:hover{background:var(--ink2)}
label.tog{display:flex;align-items:center;gap:5px;color:var(--muted);cursor:pointer;user-select:none}
label.tog input{accent-color:var(--ink)}
.spacer{flex:1}
.boardWrap{position:relative;box-shadow:0 1px 0 rgba(0,0,0,.08),0 8px 24px rgba(60,40,10,.18)}
#cv{display:block;width:100%;cursor:pointer;touch-action:manipulation}
.banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-46%);opacity:0;pointer-events:none;padding:22px 36px;background:var(--paper);border:1px solid var(--ink);text-align:center;transition:opacity .4s, transform .4s;box-shadow:6px 6px 0 rgba(31,27,22,.85)}
.banner.show{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
.banner b{display:block;font-family:var(--serif);font-size:28px;font-weight:900;margin-bottom:6px}
.banner small{color:var(--muted)}
.status{margin-top:14px;font-size:15px;display:flex;align-items:center;gap:10px;min-height:28px}
.status .dot{width:14px;height:14px;border-radius:50%;flex:none;border:1px solid #555}
.status .err{color:var(--atk);font-weight:700}
.dots3 span{animation:blink 1.2s infinite both}
.dots3 span:nth-child(2){animation-delay:.2s}.dots3 span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.15}40%{opacity:1}}

/* 해설 */
section{border-top:1px solid var(--ink);padding:14px 0 18px}
section:first-child{border-top:none;padding-top:0}
h2{font-family:var(--serif);font-size:15px;font-weight:600;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-family:var(--sans);font-weight:400;font-size:12px;color:var(--muted)}
.head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.head .co{font-family:var(--serif);font-weight:900;font-size:38px;line-height:1;letter-spacing:-1px}
.head .n{font-size:13px;color:var(--muted)}
.head .mode{font-size:12px;border:1px solid var(--ink2);padding:1px 7px;border-radius:2px}
.head .meta{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.wp{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.wp .big{font-family:var(--serif);font-weight:900;font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
.wp .lbl{font-size:13px;color:var(--muted)}
.wpbar{height:6px;background:var(--paper2);position:relative;margin-bottom:20px}
.wpbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ink);transition:width 1s cubic-bezier(.25,.8,.25,1)}
.wpbar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--atk)}
h3{font-size:13px;font-weight:700;margin:0 0 8px;color:var(--ink2)}
.stack{display:flex;height:14px;margin-bottom:12px;background:var(--paper2)}
.stack div{width:0;transition:width .9s cubic-bezier(.25,.8,.25,1)}
.rows{display:flex;flex-direction:column;gap:7px}
.r{display:grid;grid-template-columns:10px 54px 1fr 44px;align-items:center;gap:10px;font-size:14px}
.r .sw{width:10px;height:10px}
.r .bar{height:4px;background:var(--paper2)}
.r .bar i{display:block;height:100%;width:0;transition:width .9s cubic-bezier(.25,.8,.25,1)}
.r .pct{font-family:var(--serif);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
ol.why{margin:16px 0 0;padding:0;list-style:none;counter-reset:w}
ol.why li{font-size:14px;line-height:1.65;padding:7px 0 7px 18px;border-top:1px dotted var(--rule);position:relative;color:var(--ink2);opacity:0;animation:fade .45s ease forwards}
ol.why li::before{content:"";position:absolute;left:0;top:14px;width:8px;height:8px;background:var(--c)}
ol.why li b{color:var(--ink)}
@keyframes fade{to{opacity:1}}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;text-align:left;border-bottom:1px dotted var(--rule)}
th{color:var(--muted);font-weight:400;font-size:12px;border-bottom:1px solid var(--ink2)}
td.co{font-family:var(--serif);font-weight:600;width:46px}
td.p{width:52px;text-align:right;font-variant-numeric:tabular-nums}
td.note{width:96px;font-size:12px;color:var(--muted);text-align:right}
.mini{height:4px;background:var(--paper2)}
.mini i{display:block;height:100%;width:0;background:var(--ink2);transition:width .8s cubic-bezier(.25,.8,.25,1)}
tbody tr{cursor:default}
tbody tr:hover{background:var(--paper2)}
tr.sel td{font-weight:700}
tr.sel .mini i{background:var(--atk)}
tr.bad td{color:#a59b8e;text-decoration:line-through;text-decoration-color:rgba(0,0,0,.25)}
tr.bad td.note{text-decoration:none}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.hist{display:flex;flex-wrap:wrap;gap:4px 6px;max-height:120px;overflow:auto;font-size:13px}
.hist button{font-size:12.5px;padding:3px 8px;border-color:var(--rule);font-variant-numeric:tabular-nums}
.hist button.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.spark{width:100%;height:64px;display:block;margin:2px 0 10px}
.empty{color:var(--muted);font-size:14px;line-height:1.7}
.legend{font-size:12.5px;color:var(--muted);line-height:1.8;margin-top:12px}
.legend i{display:inline-block;width:8px;height:8px;margin-right:4px}
.think{font-size:15px;line-height:1.7}
.think .prog{height:3px;background:var(--paper2);margin:12px 0 10px}
.think .prog i{display:block;height:100%;background:var(--ink);width:0;transition:width .3s}
.think b{font-family:var(--serif)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>오목</h1><span class="seal">AI</span>
    <p id="ruleText"></p>
  </header>
  <div class="main">
    <div class="boardCol">
      <div class="controls">
        <label class="f">나는 <select id="color"><option value="1">흑 (선공)</option><option value="2">백 (후공)</option></select></label>
        <label class="f">룰 <select id="rule"><option value="renju" selected>렌주룰</option><option value="free">기본룰</option></select></label>
        <label class="f">판 <select id="size"><option value="19" selected>19×19</option><option value="15">15×15</option></select></label>
        <label class="f">난이도 <select id="level"><option value="0">보통</option><option value="1">어려움</option><option value="2" selected>최강</option></select></label>
        <label class="f">생각 시간 <select id="mul"><option value="0.5">빠르게</option><option value="1" selected>보통</option><option value="2.5">깊게</option></select></label>
        <span class="spacer"></span>
        <label class="tog"><input type="checkbox" id="fbTog" checked> 금수</label>
        <label class="tog"><input type="checkbox" id="candTog"> 후보 위치</label>
        <button id="undoBtn">무르기</button>
        <button class="primary" id="newBtn">새 게임</button>
      </div>
      <div class="boardWrap">
        <canvas id="cv"></canvas>
        <div class="banner" id="banner"></div>
      </div>
      <div class="status" id="status"></div>
    </div>
    <div class="side">
      <section>
        <h2>해설 <small>AI가 이 자리에 둔 이유</small></h2>
        <div id="why"><div class="empty">AI가 수를 두면 그 자리를 고른 이유를 공격·수비·수읽기·위치의 비율로 풀어 드립니다.</div></div>
      </section>
      <section>
        <h2>다른 후보 <small>줄에 마우스를 올리면 판에 위치가 표시됩니다</small></h2>
        <div id="cands"><div class="empty">—</div></div>
      </section>
      <section>
        <h2>기보 <small>AI 승률 흐름 · 누르면 그때의 해설</small></h2>
        <svg class="spark" id="spark" viewBox="0 0 300 64" preserveAspectRatio="none"></svg>
        <div class="hist" id="hist"><span class="empty">—</span></div>
        <div class="legend">
          <i style="background:var(--atk)"></i><b>공격</b> 이 수로 만든 내 모양(4, 열린 3 등)의 위력<br>
          <i style="background:var(--def)"></i><b>수비</b> 상대가 여기 뒀다면 생겼을 위협을 미리 없앤 정도<br>
          <i style="background:var(--read)"></i><b>수읽기</b> 몇 수 앞을 계산해 결정이 바뀐 정도(필승 수순, 함정 회피 포함)<br>
          <i style="background:var(--pos)"></i><b>위치</b> 중앙과의 거리, 주변 돌과의 연결
        </div>
      </section>
    </div>
  </div>
</div>

<script id="engine" type="text/plain">// ===== 오목 엔진 (Web Worker) =====
let N = 15, NN = 225;
const WIN = 1e9;
const DX = [1, 0, 1, 1], DY = [0, 1, 1, -1];
// 패턴 유형: 7 오목, 6 열린4, 5 4, 4 열린3, 3 닫힌3, 2 열린2, 1 닫힌2
const PATS = [
  [7, ['11111']],
  [6, ['011110']],
  [5, ['11110', '01111', '11101', '11011', '10111']],
  [4, ['011100', '001110', '011010', '010110']],
  [3, ['01110', '11100', '00111', '11010', '01011', '10110', '01101', '11001', '10011', '10101']],
  [2, ['001100', '011000', '000110', '001010', '010100', '010010']],
  [1, ['11000', '00011', '10100', '00101', '10010', '01001', '10001', '01100', '00110', '01010']],
];
let b = new Int8Array(NN);
let RENJU = true;
function setRule(r) { const nr = r !== 'free'; if (nr !== RENJU) epoch++; RENJU = nr; }
let stones = [];

function classify(s, me) {
  for (const [t, list] of PATS) {
    for (const p of list) {
      const L = p.length;
      for (let st = Math.max(0, 6 - L); st <= 5 && st + L <= 11; st++) {
        if (p.charCodeAt(5 - st) === 49 && s.substr(st, L) === p) {
          // 렌주: 흑은 장목(6목 이상)이 되는 모양은 인정하지 않음
          if (me === 1 && ((st > 0 && s.charCodeAt(st - 1) === 49) || (st + L < 11 && s.charCodeAt(st + L) === 49))) continue;
          return t;
        }
      }
    }
  }
  return 0;
}
// 한 방향 11칸(가운데 제외 10칸, 3진수)의 모든 경우를 미리 분류해 둔 표
const TAB = [null, new Int8Array(59049), new Int8Array(59049)];
(function () {
  for (let code = 0; code < 59049; code++) {
    let c = code, s = '';
    for (let i = 0; i < 10; i++) { s = (c % 3) + s; c = (c / 3) | 0; }
    s = s.slice(0, 5) + '1' + s.slice(5);
    TAB[1][code] = classify(s, 1);
    TAB[2][code] = classify(s, 2);
  }
})();
// 칸·방향별 모양 판정 결과를 저장해 두고, 돌이 놓이거나 빠질 때 영향받는 칸만 지움
// 칸 주변 ±5칸 창(window)의 상태 번호: 이 값이 같으면 모양 판정도 같음
let wDiv = new Float64Array(NN * 4).fill(1), wMod = new Float64Array(NN * 4).fill(1);
const wKey = i => cellLineDir[i] < 0 ? -1 : Math.floor(lineCode[cellLineDir[i]] / wDiv[i]) % wMod[i];
let cellLineDir = new Int32Array(NN * 4).fill(-1), tcKey = new Float64Array(NN * 4), ccK = new Float64Array(NN * 4);
let tcOK = new Int32Array(NN * 4), tcV = new Int8Array(NN * 8), tcVf = new Int8Array(NN * 4), epoch = 1;
function typeDir(x, y, d, me) {
  const idx = (y * N + x) * 4 + d, lid = cellLineDir[idx];
  if (lid < 0) return 0; // 길이 5 미만인 대각선: 어떤 모양도 생길 수 없음
  const key = lineCode[lid];
  if (tcOK[idx] === epoch && tcKey[idx] === key) return tcV[idx * 2 + me - 1];
  let c1 = 0, c2 = 0;
  const dx = DX[d], dy = DY[d];
  for (let k = -5; k <= 5; k++) {
    if (k === 0) continue;
    const nx = x + dx * k, ny = y + dy * k;
    let v1, v2;
    if (nx < 0 || ny < 0 || nx >= N || ny >= N) { v1 = 2; v2 = 2; }
    else {
      const q = b[ny * N + nx];
      if (q === 0) { v1 = 0; v2 = 0; } else if (q === 1) { v1 = 1; v2 = 2; } else { v1 = 2; v2 = 1; }
    }
    c1 = c1 * 3 + v1; c2 = c2 * 3 + v2;
  }
  tcV[idx * 2] = (RENJU ? TAB[1] : TAB[2])[c1];
  tcVf[idx] = TAB[2][c1];
  tcV[idx * 2 + 1] = TAB[2][c2];
  tcOK[idx] = epoch; tcKey[idx] = key;
  return tcV[idx * 2 + me - 1];
}
let ccOK = new Int32Array(NN), ccMask = new Int32Array(NN * 2), ccScore = new Float64Array(NN * 2), ccN4 = new Int8Array(NN * 2), ccOver = new Uint8Array(NN);
function cellInfo(c) {
  const i4 = c * 4;
  const k0 = cellLineDir[i4] < 0 ? -1 : lineCode[cellLineDir[i4]], k1 = cellLineDir[i4 + 1] < 0 ? -1 : lineCode[cellLineDir[i4 + 1]],
    k2 = cellLineDir[i4 + 2] < 0 ? -1 : lineCode[cellLineDir[i4 + 2]], k3 = cellLineDir[i4 + 3] < 0 ? -1 : lineCode[cellLineDir[i4 + 3]];
  if (ccOK[c] === epoch && ccK[i4] === k0 && ccK[i4 + 1] === k1 && ccK[i4 + 2] === k2 && ccK[i4 + 3] === k3) return;
  ccK[i4] = k0; ccK[i4 + 1] = k1; ccK[i4 + 2] = k2; ccK[i4 + 3] = k3;
  const x = c % N, y = (c / N) | 0;
  ccOver[c] = 0;
  for (let me = 1; me <= 2; me++) {
    let mask = 0, n4 = 0, k1 = 0, k2 = 0, k3 = 0, k4 = 0, k5 = 0, k6 = 0, k7 = 0;
    for (let d = 0; d < 4; d++) {
      const t = typeDir(x, y, d, me);
      mask |= 1 << t;
      if (t >= 4) n4++;
      if (me === 1 && t !== 7 && tcVf[(c * 4) + d] === 7) ccOver[c] = 1;
      if (t === 1) k1++; else if (t === 2) k2++; else if (t === 3) k3++; else if (t === 4) k4++; else if (t === 5) k5++; else if (t === 6) k6++; else if (t === 7) k7++;
    }
    let sc;
    if (k7) sc = 1e7; else if (k6 || k5 >= 2) sc = 1e6; else if (k5 && k4) sc = 1e5; else if (k4 >= 2) sc = 5e4;
    else sc = k5 * 1500 + k4 * 2000 + k3 * 200 + k2 * 150 + k1 * 20;
    ccMask[c * 2 + me - 1] = mask; ccScore[c * 2 + me - 1] = sc; ccN4[c * 2 + me - 1] = n4;
  }
  ccOK[c] = epoch;
}
const maskAt = (c, me) => { cellInfo(c); return ccMask[c * 2 + me - 1]; };
const scoreAt = (c, me) => { cellInfo(c); return ccScore[c * 2 + me - 1]; };
function invalidate(c) {
  const x = c % N, y = (c / N) | 0;
  for (let d = 0; d < 4; d++) {
    const dx = DX[d], dy = DY[d];
    for (let k = -5; k <= 5; k++) {
      const nx = x + dx * k, ny = y + dy * k;
      if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
      const e = ny * N + nx;
      tcOK[e * 4 + d] = 0; ccOK[e] = 0;
    }
  }
}
function pointTypes(c, me) {
  const x = c % N, y = (c / N) | 0;
  return [typeDir(x, y, 0, me), typeDir(x, y, 1, me), typeDir(x, y, 2, me), typeDir(x, y, 3, me)];
}
function scoreT(ts) {
  const c = [0, 0, 0, 0, 0, 0, 0, 0];
  for (const t of ts) c[t]++;
  if (c[7]) return 1e7;
  if (c[6] || c[5] >= 2) return 1e6;
  if (c[5] && c[4]) return 1e5;
  if (c[4] >= 2) return 5e4;
  return c[5] * 1500 + c[4] * 2000 + c[3] * 200 + c[2] * 150 + c[1] * 20;
}

// ---- 라인 단위 판세 평가 (증분 갱신) ----
let cellLP = [], lineCode = new Float64Array(0);
const POW3 = []; for (let i = 0, v = 1; i < 26; i++, v *= 3) POW3.push(v);
let lines = [], cellLines = [], lineCur = [], mark = new Int32Array(NN);
function init(n) {
  if (n === N && lines.length) return;
  N = n; NN = n * n; b = new Int8Array(NN); mark = new Int32Array(NN);
  tcOK = new Int32Array(NN * 4); tcV = new Int8Array(NN * 8); tcVf = new Int8Array(NN * 4); epoch++;
  gA = new Float64Array(NN); gD = new Float64Array(NN); gH = new Float64Array(NN); gF = new Uint8Array(NN);
  nearCnt = new Int16Array(NN); candList = new Int32Array(NN); candPos = new Int32Array(NN).fill(-1); candLen = 0; nb25 = [];
  for (let c = 0; c < NN; c++) {
    const x = c % N, y = (c / N) | 0, l = [];
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
      const nx = x + dx, ny = y + dy;
      if (nx >= 0 && ny >= 0 && nx < N && ny < N) l.push(ny * N + nx);
    }
    nb25.push(l);
  }
  ccOK = new Int32Array(NN); ccMask = new Int32Array(NN * 2); ccScore = new Float64Array(NN * 2); ccN4 = new Int8Array(NN * 2); ccOver = new Uint8Array(NN);
  lines = []; cellLines = []; cellLP = []; cellLineDir = new Int32Array(NN * 4).fill(-1); wDiv = new Float64Array(NN * 4).fill(1); wMod = new Float64Array(NN * 4).fill(1); tcKey = new Float64Array(NN * 4); ccK = new Float64Array(NN * 4);
  for (let i = 0; i < NN; i++) { cellLines.push([]); cellLP.push([]); }
  for (let d = 0; d < 4; d++) {
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const px = x - DX[d], py = y - DY[d];
    if (px >= 0 && py >= 0 && px < N && py < N) continue;
    const cs = [];
    let cx = x, cy = y;
    while (cx >= 0 && cy >= 0 && cx < N && cy < N) { cs.push(cy * N + cx); cx += DX[d]; cy += DY[d]; }
    if (cs.length >= 5) { const id = lines.length; lines.push(cs); cs.forEach((c, i) => { cellLines[c].push(id); cellLP[c].push(i); cellLineDir[c * 4 + d] = id; const lo = Math.max(0, i - 5), hi = Math.min(cs.length, i + 6); wDiv[c * 4 + d] = POW3[lo]; wMod[c * 4 + d] = POW3[hi - lo]; }); }

function scramble(now, c) {
  const t = Math.floor(now / 70);
  const v = Math.sin((t + 1) * 12.9898 + c * 78.233) * 43758.5453;
  return 10 + Math.floor((v - Math.floor(v)) * 89);
}
function label(x, y, text, fill, ink, scale, alpha) {
  ctx.globalAlpha = alpha;
  ctx.font = `600 ${Math.max(9, cell * 0.3 * scale)}px 'Noto Serif KR', serif`;
  const w = Math.max(cell * 0.78, ctx.measureText(text).width + cell * 0.22) * (scale > 1 ? 1.05 : 1), h = cell * 0.5 * scale;
  ctx.fillStyle = fill; ctx.strokeStyle = ink; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, 3); ctx.fill(); ctx.stroke();
  ctx.fillStyle = ink === '#c23a22' && fill === '#c23a22' ? '#fbf6ec' : ink;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y + 1);
  ctx.globalAlpha = 1;
}
function drawCalc(now) {
  stepCalc(now);
  if (!calc || !calc.disp.size) {
    if (calc && calc.phase === 'scan' && now - calc.start > 120) { // 후보가 정해지기 전: 판을 훑는 표시
      const c = (N * N - 1) / 2, a = now / 300;
      ctx.strokeStyle = 'rgba(31,27,22,.35)'; ctx.setLineDash([3, 4]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(P(c % N) + Math.cos(a) * cell * 2, P((c / N) | 0) + Math.sin(a) * cell * 2, cell * 0.4, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    }
    return;
  }
  const fadeK = calc.phase === 'fade' ? Math.min(1, (now - calc.phaseAt) / 550) : 0;
  const entries = [...calc.disp.entries()];
  // 계산 중인 자리를 차례로 짚는 점선 원
  if (calc.phase === 'scan') {
    const [c] = entries[Math.floor(now / 140) % entries.length];
    if (!board[c]) {
      ctx.strokeStyle = 'rgba(31,27,22,.5)'; ctx.setLineDash([3, 3]); ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(P(c % N) + .5, P((c / N) | 0) + .5, cell * 0.55, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    }
  }
  for (const [c, e] of entries) {
    if (board[c]) continue;
    const x = P(c % N) + .5, y = P((c / N) | 0) + .5;
    let v;
    if (e.to === null) v = scramble(now, c);
    else {
      const k = Math.min(1, (now - e.at) / 420);
      const from = e.from === null ? scramble(now, c) : e.from;
      v = k < 1 ? Math.round(from + (e.to - from) * ease(k)) : e.to;
    }
    e.cur = v;
    const born = Math.min(1, (now - e.born) / 200);
    const isChosen = calc.chosen === c;
    let alpha = born * (1 - fadeK);
    if (calc.phase === 'settle' && !isChosen) alpha *= 0.35;
    const text = e.lose && e.to !== null ? '✕' : v + '%';
    if (isChosen) label(x, y, text, '#c23a22', '#c23a22', 1.15, alpha);
    else label(x, y, text, 'rgba(250,246,237,.94)', e.rank === 0 && e.to !== null ? '#1f1b16' : 'rgba(31,27,22,.7)', 1, alpha);
  }
}

const turnIsHuman = () => (moves.length % 2 === 0 ? 1 : 2) === human;

// ---------- 패널 ----------
function renderStatus() {
  const st = document.getElementById('status'), ban = document.getElementById('banner');
  const dot = p => `<span class="dot" style="background:${p === 1 ? '#151412' : '#f7f3ea'}"></span>`;
  if (over) {
    st.innerHTML = result === 'human' ? '<b>당신이 이겼습니다.</b>' : result === 'ai' ? '<b>AI가 이겼습니다.</b> 기보에서 수를 눌러 해설을 다시 볼 수 있습니다.' : '무승부입니다.';
    ban.innerHTML = result === 'human' ? '<b>승리</b><small>AI를 꺾었습니다</small>' : result === 'ai' ? '<b>패배</b><small>기보를 눌러 AI의 판단을 되짚어 보세요</small>' : '<b>무승부</b>';
    setTimeout(() => ban.classList.add('show'), 600);
  } else {
    ban.classList.remove('show');
    if (busy) st.innerHTML = `AI가 생각하고 있습니다<span class="dots3"><span>.</span><span>.</span><span>.</span></span>`;
    else if (flash) st.innerHTML = `<span class="err">✕</span> ${flash}`;
    else st.innerHTML = `${dot(human)} 당신 차례 (${human === 1 ? '흑' : '백'})` +
      (human === 1 && rule === 'renju' && forbidden.size ? ` <span style="color:var(--muted);font-size:13px">— 빨간 ✕ 자리는 금수입니다</span>` : '');
  }
}
function renderThinking() {
  if (!busy) return;
  const box = document.getElementById('why');
  const maxD = (live && live.maxD) || MAXD[level] + (mul > 1 ? 2 : 0);
  const d = live ? live.depth : 0;
  if (!box.querySelector('.think')) {
    whyKey = 'thinking';
    box.innerHTML = '<div class="think"><div class="t1"></div><div class="prog"><i></i></div><div class="t2" style="color:var(--muted);font-size:13px"></div></div>';
  }
  const best = live && live.cands && live.cands[0];
  box.querySelector('.t1').innerHTML = !live ? '필승 수순과 함정을 먼저 살피는 중'
    : d <= 0 ? `후보 <b>${live.cands.length}</b>곳을 추렸습니다` : d === 99 ? '결정했습니다' : `<b>${d}</b>수 앞까지 읽었습니다 <span style="color:var(--muted)">/ 최대 ${maxD}수</span>`;
  box.querySelector('.prog i').style.width = (Math.max(0, Math.min(d, maxD)) / maxD * 100) + '%';
  box.querySelector('.t2').innerHTML = best && d > 0 && d < 99 ? `지금까지 가장 좋은 자리: ${coord(best.c)} (승률 ${Math.round(best.wp * 100)}%)` : '';
}
function renderWhy() {
  if (busy) { renderThinking(); return; }
  const view = viewIdx >= 0 ? moves[viewIdx] : null;
  if (!view || !view.an) return;
  const key = viewIdx + ':' + view.c;
  if (key === whyKey) return;
  whyKey = key;
  const box = document.getElementById('why'), cbox = document.getElementById('cands');
  const an = view.an, bd = breakdown(an);
  const wpPct = Math.round(an.wp * 100);
  const parts = [['atk', '공격', bd.atk], ['def', '수비', bd.def], ['read', '수읽기', bd.read], ['pos', '위치', bd.pos]];
  const modeTag = { opening: '첫 수', win: '승리', block: '강제 수비', vcf: '필승 수순(4)', vct: '필승 수순(3·4)', book: '정석', only: '유일한 안전수', search: `${an.depth}수 앞 읽기` }[an.mode];
  box.innerHTML = `
    <div class="head"><span class="co">${coord(an.move)}</span><span class="n">제${an.num}수 · ${an.me === 1 ? '흑' : '백'}</span><span class="mode">${modeTag}</span>
      ${an.nodes ? `<span class="meta">${an.nodes.toLocaleString()}국면 · ${(an.ms / 1000).toFixed(2)}초${an.workers > 1 ? ` · 코어 ${an.workers}개` : ''}</span>` : ''}</div>
    <div class="wp"><span class="big" id="wpVal">0</span><span style="font-family:var(--serif);font-size:20px">%</span><span class="lbl">AI가 보는 자기 승률</span></div>
    <div class="wpbar"><i data-w="${wpPct}"></i></div>
    <h3>이 자리를 고른 이유</h3>
    <div class="stack">${parts.map(([k, , v]) => `<div style="background:${COLORS[k]}" data-w="${v}"></div>`).join('')}</div>
    <div class="rows">${parts.map(([k, n, v]) => `
      <div class="r"><span class="sw" style="background:${COLORS[k]}"></span><span>${n}</span>
      <div class="bar"><i style="background:${COLORS[k]}" data-w="${v}"></i></div><span class="pct" data-v="${v}">0%</span></div>`).join('')}</div>
    <ol class="why">${bullets(an).map(([k, t], i) => `<li style="--c:${COLORS[k]};animation-delay:${0.35 + i * 0.1}s">${t}</li>`).join('')}</ol>`;
  nextFrame(() => {
    box.querySelector('.wpbar i').style.width = box.querySelector('.wpbar i').dataset.w + '%';
    box.querySelectorAll('.stack div').forEach(s => s.style.width = s.dataset.w + '%');
    box.querySelectorAll('.r .bar i').forEach((b, i) => setTimeout(() => b.style.width = b.dataset.w + '%', i * 80));
    box.querySelectorAll('.pct').forEach((p, i) => setTimeout(() => countUp(p, +p.dataset.v, 800, 0, '%'), i * 80));
    countUp(document.getElementById('wpVal'), wpPct, 900);
  });

  if (an.cands.length <= 1) {
    cbox.innerHTML = `<div class="empty">${an.mode === 'opening' ? '첫 수라 비교할 후보가 없습니다.' : '고민할 필요가 없는 수(승리, 강제 수비, 필승 수순)라 다른 후보는 따지지 않았습니다.'}</div>`;
  } else {
    cbox.innerHTML = `<table><thead><tr><th>자리</th><th>예상 승률</th><th></th><th></th></tr></thead><tbody>${an.cands.slice(0, 8).map(k => {
      const p = Math.round(k.wp * 100);
      const cls = k.c === an.move ? 'sel' : k.lose ? 'bad' : '';
      const note = k.c === an.move ? '선택' : k.lose ? '상대 필승 허용' : k.bound ? '이보다 낮음' : '';
      return `<tr class="${cls}" data-c="${k.c}"><td class="co">${coord(k.c)}</td><td><div class="mini"><i data-w="${p}"></i></div></td><td class="p" data-v="${p}" data-pre="${k.bound && !k.lose ? '≤' : ''}">0%</td><td class="note">${note}</td></tr>`;
    }).join('')}</tbody></table><div class="hint">이 표의 승률은 AI 입장에서 계산한 값입니다.</div>`;
    cbox.querySelectorAll('tbody tr').forEach(tr => {
      tr.onmouseenter = () => { hoverCand = +tr.dataset.c; };
      tr.onmouseleave = () => { hoverCand = -1; };
    });
    nextFrame(() => {
      cbox.querySelectorAll('.mini i').forEach((b, i) => setTimeout(() => b.style.width = b.dataset.w + '%', 150 + i * 60));
      cbox.querySelectorAll('td.p').forEach((td, i) => setTimeout(() => {
        const pre = td.dataset.pre, to = +td.dataset.v, t0 = performance.now();
        const f = t => { const k = Math.min(1, (t - t0) / 700); td.textContent = pre + Math.round(to * ease(k)) + '%'; if (k < 1) requestAnimationFrame(f); };
        requestAnimationFrame(f);
      }, 150 + i * 60));
    });
  }
}
function renderHist() {
  const h = document.getElementById('hist'), sp = document.getElementById('spark');
  const list = moves.map((m, i) => [m, i]).filter(([m]) => m.an);
  if (!list.length) { h.innerHTML = '<span class="empty">—</span>'; sp.innerHTML = ''; return; }
  h.innerHTML = list.map(([m, i]) => `<button class="${i === viewIdx ? 'on' : ''}" data-i="${i}">${m.an.num}. ${coord(m.c)}</button>`).join('');
  h.querySelectorAll('button').forEach(b => b.onclick = () => { viewIdx = +b.dataset.i; whyKey = null; hoverCand = -1; render(); });
  h.scrollTop = h.scrollHeight;
  const W = 300, H = 64, n = list.length;
  const pts = list.map(([m], i) => [n === 1 ? W / 2 : 4 + (W - 8) * i / (n - 1), 5 + (H - 10) * (1 - m.an.wp)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const sel = list.findIndex(([, i]) => i === viewIdx);
  sp.innerHTML = `
    <line x1="0" x2="${W}" y1="${H / 2}" y2="${H / 2}" stroke="#c9bca5" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"/>
    <path d="${line}" fill="none" stroke="#1f1b16" stroke-width="1.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    ${sel >= 0 ? `<circle cx="${pts[sel][0]}" cy="${pts[sel][1]}" r="3.5" fill="#c23a22"/>` : ''}`;
}
function render() { renderStatus(); renderWhy(); renderHist(); }

function cellAt(ev) {
  const r = cv.getBoundingClientRect();
  const x = Math.round((ev.clientX - r.left) / cell) - 1, y = Math.round((ev.clientY - r.top) / cell) - 1;
  if (x < 0 || y < 0 || x >= N || y >= N) return -1;
  return y * N + x;
}
cv.addEventListener('click', ev => {
  if (busy || over || !turnIsHuman()) return;
  const c = cellAt(ev);
  if (c < 0 || board[c]) return;
  if (human === 1 && forbidden.has(c)) {
    flash = `${coord(c)}는 흑의 금수 자리입니다(삼삼·사사·장목). 다른 곳에 두세요.`;
    renderStatus(); return;
  }
  hover = -1;
  play(c, human, null);
});
cv.addEventListener('mousemove', ev => { hover = cellAt(ev); });
cv.addEventListener('mouseleave', () => { hover = -1; });
document.getElementById('newBtn').onclick = newGame;
document.getElementById('undoBtn').onclick = undoMove;
document.getElementById('level').onchange = e => { level = +e.target.value; };
document.getElementById('mul').onchange = e => { mul = +e.target.value; };
document.getElementById('size').onchange = newGame;
document.getElementById('rule').onchange = newGame;
document.getElementById('candTog').onchange = e => { showCand = e.target.checked; };
document.getElementById('fbTog').onchange = e => { showFb = e.target.checked; };
document.getElementById('banner').onclick = () => document.getElementById('banner').classList.remove('show');
window.addEventListener('resize', resize);
if (document.fonts) document.fonts.ready.then(buildWood);
newGame();
requestAnimationFrame(frame);
</script>
